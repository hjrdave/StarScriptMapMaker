name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, core deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: core must not depend on egui or wgpu
        run: ./scripts/check-core-deps.sh

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS only for now (ADR 0008). macOS has no software adapter, so its render
          # tests are smoke tests only. Linux and Windows return when we go cross-platform.
          - name: macOS arm64
            os: macos-15
            software_gpu: ""
    runs-on: ${{ matrix.os }}
    env:
      SSMAP_REQUIRE_SOFTWARE_GPU: ${{ matrix.software_gpu }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Upload failed golden renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ runner.os }}
          path: target/tmp/*.actual.png
          if-no-files-found: ignore
