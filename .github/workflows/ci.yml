name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, core deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: core must not depend on egui or wgpu
        run: ./scripts/check-core-deps.sh

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    # macOS only, by the author's decision (ADR 0008). macOS has no software adapter, so its
    # render tests are smoke tests only and the golden images are not compared in CI.
    name: test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Upload failed golden renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ runner.os }}
          path: target/tmp/*.actual.png
          if-no-files-found: ignore
