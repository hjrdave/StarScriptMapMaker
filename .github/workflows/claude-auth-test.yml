name: Claude Auth Test

# One-off diagnostic. Manual only. Calls the Claude CLI directly with the
# CLAUDE_CODE_OAUTH_TOKEN secret and prints what it says, so an auth problem is visible.
# Prints only the CLI's reply or error (Actions masks the token). Safe to delete afterwards.
# Also checks the reviewer GitHub App secrets (presence/shape only, never values) and tries
# to mint a token with the same permissions claude-review.yml asks for.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Is the secret present?
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or missing"; exit 1; fi
          echo "secret present; length ${#TOKEN}; prefix ${TOKEN:0:10}"
          case "$TOKEN" in *$'\n'*|*" "*) echo "::warning::token contains whitespace/newline";; esac

      - name: Install Claude CLI (same version the action uses)
        run: npm install -g @anthropic-ai/claude-code@2.1.299

      - name: Ask Claude to say ok
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p "Reply with the single word: ok" --output-format json --max-turns 1 > out.json 2> err.txt
          code=$?
          echo "exit code: $code"
          echo "--- stdout"; cat out.json; echo
          echo "--- stderr"; cat err.txt
          exit $code

  reviewer-app-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reviewer App secrets present? (shape only)
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.REVIEWER_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ]; then echo "::error::REVIEWER_APP_ID is empty or missing in this run"; else echo "REVIEWER_APP_ID: length ${#APP_ID}, digits only: $([[ "$APP_ID" =~ ^[0-9]+$ ]] && echo yes || echo NO)"; fi
          if [ -z "$APP_KEY" ]; then echo "::error::REVIEWER_APP_KEY is empty or missing in this run"; else
            echo "REVIEWER_APP_KEY: length ${#APP_KEY}, lines $(printf '%s\n' "$APP_KEY" | wc -l), first line: $(printf '%s\n' "$APP_KEY" | head -n1)"; fi

      - name: Try to mint the reviewer token
        id: mint
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-checks: read

      - name: Result
        env:
          OUTCOME: ${{ steps.mint.outcome }}
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          echo "mint outcome: $OUTCOME"
          [ "$OUTCOME" = success ] || exit 1
          echo "token works; repos it can see:"
          gh api /installation/repositories --jq '.repositories[].full_name'
