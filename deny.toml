# Dependency licence and source policy (ADR 0001): permissive licences and
# MPL-2.0 only; the GPL family is denied because the app may be sold.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

# egui's bundled UI fonts are under font licences, not code licences.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
