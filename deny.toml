# cargo-deny policy (ADR 0001). Permissive licences plus MPL-2.0; no GPL family,
# because the app may be sold.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices only fail for our direct dependencies; transitive ones
# (such as winit's Wayland title bar) are upstream's to replace.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  # Permissive, no copyleft; pulled in by arboard's Windows clipboard backend.
  "BSL-1.0",
]
# Anything not in `allow`, including GPL, LGPL and AGPL, is denied.
# CC0 and MPL-2.0 are policy even before a dependency uses them.
unused-allowed-license = "allow"

# egui's built-in UI fonts. Font licences cover the fonts only, not our code.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
