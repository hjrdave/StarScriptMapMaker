[package]
name = "app"
description = "StarScript Map Maker desktop editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ssmap_app"

[[bin]]
name = "starscript-map-maker"
path = "src/main.rs"

[dependencies]
ssmap-core.workspace = true
ssmap-render.workspace = true
directories.workspace = true
ssmap-fonts.workspace = true
eframe.workspace = true
image.workspace = true
lyon.workspace = true
rfd.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
trash.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.36", features = ["eframe"] }

# Not `workspace = true`: that forbids `unsafe`, and `native_menu/dock.rs` needs it to add the
# Dock-click method to winit's app delegate. Keep in step with the workspace table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Installable packages, built by `cargo packager --release` from this folder (ADR 0008,
# docs/packaging.md). Paths are relative to this crate. All packages are unsigned.
[package.metadata.packager]
name = "starscript-map-maker"
product-name = "StarScript Map Maker"
identifier = "io.github.hjrdave.StarScriptMapMaker"
publisher = "StarScript Map Maker"
authors = ["StarScript Map Maker contributors"]
homepage = "https://github.com/hjrdave/StarScriptMapMaker"
category = "GraphicsAndDesign"
before-packaging-command = "cargo build --release --locked -p app"
out-dir = "../../target/packages"
formats = ["nsis", "dmg", "appimage", "deb"]
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.ico",
]
# Built-in Asset packs and fonts, read-only inside the install. `ssmap_core::asset::assets_dir`
# is the one place that knows where each package puts them.
# LICENSE ships as a plain file. Setting `license-file` would make the DMG and the installer
# demand acceptance, which MIT doesn't ask for (and a DMG with one can't mount unattended).
resources = [
  { src = "../../assets", target = "assets" },
  { src = "../../LICENSE", target = "LICENSE" },
]

[[package.metadata.packager.file-associations]]
extensions = ["ssmap"]
# The Windows ProgID; Explorer shows `description` as the file type.
name = "StarScriptMapMaker.Map"
description = "StarScript Map"
mime-type = "application/x-starscript-map"
role = "editor"

[package.metadata.packager.nsis]
# Per-user: installs to %LOCALAPPDATA% and registers .ssmap under HKCU, so no admin.
installer-mode = "currentUser"
installer-icon = "packaging/icons/icon.ico"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Replaces the generated document types to add a UTI for .ssmap files.
info-plist-path = "packaging/macos/Info.plist"

[package.metadata.packager.deb]
package-name = "starscript-map-maker"
# winit and wgpu load these at runtime, so dpkg-shlibdeps can't see them. libc6 matches the
# nightly build host (ubuntu-22.04).
depends = [
  "libc6 (>= 2.35)",
  "libgcc-s1",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcursor1",
  "libxi6",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libwayland-egl1",
  "libvulkan1",
  "libegl1",
]
section = "graphics"
# The default template leaves off the trailing `;` the desktop-entry spec wants on lists.
desktop-template = "packaging/linux/main.desktop"
files = { "packaging/linux/starscript-map-maker.xml" = "usr/share/mime/packages/starscript-map-maker.xml" }

[package.metadata.packager.appimage]
files = { "packaging/linux/starscript-map-maker.xml" = "usr/share/mime/packages/starscript-map-maker.xml" }
