# The default Asset pack: Kenney's Cartography Pack (CC0), built from the 128px Retina PNGs
# in assets/vendor/kenney-cartography/ (the untouched source). Crediting Kenney is optional,
# so this pack does not ask for attribution; the fields below are metadata only.
