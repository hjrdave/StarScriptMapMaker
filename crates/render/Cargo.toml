[package]
name = "ssmap-render"
description = "wgpu Canvas rendering and PNG export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
cosmic-text.workspace = true
etagere.workspace = true
image.workspace = true
lyon.workspace = true
pollster.workspace = true
png.workspace = true
resvg.workspace = true
ssmap-core.workspace = true
ssmap-fonts.workspace = true
thiserror.workspace = true
# Only for the `silhouettes` tool, which edits pack manifests without losing comments.
toml_edit.workspace = true
unicode-script.workspace = true
wgpu.workspace = true
tracing = { workspace = true, optional = true }

[features]
# Marks the frame stages with tracing spans (issue #309). Off by default; off compiles to nothing.
profiling = ["dep:tracing"]

[dev-dependencies]
# Tests and benches build Maps from raw Ops and Commands (ADR 0004).
ssmap-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "pan_zoom"
harness = false

[[bench]]
name = "open_to_frame"
harness = false

[lints]
workspace = true
