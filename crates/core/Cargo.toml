[package]
name = "ssmap-core"
description = "Map model, Commands, geometry and persistence. Never depends on egui or wgpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
geo.workspace = true
rstar.workspace = true
directories.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true

[features]
# Exposes `Map::apply`, `execute` and `revert`, so tests and benches can build a Map from raw
# Ops and Commands. Without it only `History` and the Recovery journal change a Map (ADR 0004).
test-support = []

[dev-dependencies]
# Turns the feature on for core's own integration tests and benches.
ssmap-core = { path = ".", features = ["test-support"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "large_map"
harness = false

[lints]
workspace = true
