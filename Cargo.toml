[workspace]
resolver = "3"
members = ["crates/core", "crates/fonts", "crates/render", "apps/starscript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/hjrdave/StarScriptMapMaker"
publish = false

[workspace.dependencies]
ssmap-core = { path = "crates/core" }
ssmap-fonts = { path = "crates/fonts" }
ssmap-render = { path = "crates/render" }
bytemuck = { version = "1.25", features = ["derive"] }
# Text shaping without system fonts; Labels use bundled fonts only (ADR 0006).
cosmic-text = { version = "0.19", default-features = false, features = ["std"] }
directories = "6.0"
eframe = { version = "0.36", features = ["persistence"] }
etagere = "0.3"
geo = { version = "0.33", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = { version = "1.49", features = ["glob", "json"] }
lyon = "1.0"
# Native macOS menu bar (app crate, macOS only).
muda = { version = "0.21", default-features = false }
# Dock-click reopen hook (app crate, macOS only). Versions match what eframe and winit use.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
png = "0.18"
# Native Open and Save dialogs (NSOpenPanel on macOS, the system dialogs elsewhere).
rfd = "0.17"
pollster = "1.0"
proptest = "1.12"
rstar = "0.12"
# Without its default features: no system fonts, no embedded raster images in SVGs.
resvg = { version = "0.48", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.27"
# Moves a deleted Map file to the system Trash (app crate).
trash = "5"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"
# Must match cosmic-text's, whose font fallback hook names its Script type.
unicode-script = "0.5"
# Update check only (app crate). Trust roots come from the OS store via rustls-native-certs.
# Neither webpki-roots nor rustls-platform-verifier (which pulls webpki-root-certs for wasm)
# is used: both are CDLA-Permissive-2.0, which deny.toml doesn't allow. ring is the crypto
# provider.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
uuid = { version = "1.28", features = ["v7", "serde"] }

# Must match the wgpu version egui-wgpu uses, so `render` and `app` share one device.
wgpu = "30.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
