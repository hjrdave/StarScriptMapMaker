[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/hjrdave/StarScriptMapMaker"
publish = false

[workspace.dependencies]
ssmap-core = { path = "crates/core" }
ssmap-render = { path = "crates/render" }
eframe = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
